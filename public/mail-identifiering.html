<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Identifiera dig – Stodona</title>
<style>body{margin:0;background:#f5f3ef;color:#263d37;font:17px/1.6 system-ui,sans-serif}main{max-width:440px;margin:8vh auto;padding:32px;background:white;border-radius:20px}h1{font-size:28px;line-height:1.2}label{display:block;margin-top:20px}input,button{box-sizing:border-box;width:100%;font:inherit;padding:13px;border-radius:8px;border:1px solid #8d9f96}button{margin-top:20px;background:#254f43;color:white;cursor:pointer}button:disabled{opacity:.5}a{color:inherit}#status{white-space:pre-line}footer{font-size:14px;margin-top:28px}@media(max-width:500px){main{margin:20px;padding:24px}}</style></head>
<body><main><strong>STODONA</strong><h1>Fortsätt ditt mejlärende</h1><p>Identifiera dig med mobilnumret som finns registrerat hos oss. Därefter fortsätter vi med samma ärende via mejl.</p>
<form id="form"><label for="phone">Mobilnummer</label><input id="phone" type="tel" autocomplete="tel" required><div id="codeBox" hidden><label for="code">Kod från SMS</label><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6"></div><button id="submit">Skicka kod</button></form><p id="status" role="status" aria-live="polite"></p><footer>Skriv koden här – aldrig i ett mejl. Behöver du hjälp? Ring <a href="tel:0101780150">010-178 01 50</a>.</footer></main>
<script>
const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);let step='send';const form=document.querySelector('#form'),status=document.querySelector('#status'),button=document.querySelector('#submit');
if(!/^[a-f0-9]{64}$/.test(token)){form.hidden=true;status.textContent='Öppna identifieringslänken i ditt mejl från Stodona.';}
form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;status.textContent='Vänta ett ögonblick…';try{const response=await fetch('/api/mail-identity',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,action:step,phone:document.querySelector('#phone').value,code:document.querySelector('#code').value})});const result=await response.json();if(!response.ok)throw new Error(result.error||'Försök igen.');status.textContent=result.message||result.meddelande;if(step==='send'){step='verify';document.querySelector('#codeBox').hidden=false;document.querySelector('#code').required=true;button.textContent='Identifiera mig';document.querySelector('#code').focus();}else{form.hidden=true;}}catch(error){status.textContent=error.message;}finally{button.disabled=false;}});
</script></body></html>
