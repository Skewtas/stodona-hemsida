<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Camilla, Stodonas digitala assistent">
  <title>Camilla, Stodonas digitala assistent</title>
  <defs>
    <clipPath id="rund"><circle cx="48" cy="48" r="48"/></clipPath>
  </defs>
  <g clip-path="url(#rund)">
    <!-- Bakgrund i Stodonas kräm -->
    <rect width="96" height="96" fill="#f4f1eb"/>
    <!-- Hår bakom -->
    <path d="M22 50c0-19 11.6-32 26-32s26 13 26 32v34H22z" fill="#6b4a3a"/>
    <!-- Axlar och tröja i terrakotta -->
    <path d="M14 96c2-17 16-27 34-27s32 10 34 27z" fill="#e26346"/>
    <!-- Hals -->
    <path d="M42 60h12v12c0 3.3-2.7 6-6 6s-6-2.7-6-6z" fill="#e9b99a"/>
    <!-- Ansikte -->
    <ellipse cx="48" cy="47" rx="15.5" ry="18" fill="#f1c7a9"/>
    <!-- Lugg -->
    <path d="M32.5 44c1-11 7.5-18 15.5-18s14.5 7 15.5 18c-5-6-11-8.5-17.5-8.5S37 38 32.5 44z" fill="#6b4a3a"/>
    <!-- Ögon -->
    <circle cx="42.5" cy="48.5" r="1.7" fill="#2b1f1a"/>
    <circle cx="53.5" cy="48.5" r="1.7" fill="#2b1f1a"/>
    <!-- Kinder -->
    <circle cx="38.5" cy="54" r="2.6" fill="#e26346" opacity=".18"/>
    <circle cx="57.5" cy="54" r="2.6" fill="#e26346" opacity=".18"/>
    <!-- Leende -->
    <path d="M43.5 56.5c2.6 2.6 6.4 2.6 9 0" fill="none" stroke="#9c4a36" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>
